name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Test the decoder and build the app
        run: ./gradlew :decoder:test :app:assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: thor-companion-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ThorCompanion-addon
          path: addon/ThorCompanion
