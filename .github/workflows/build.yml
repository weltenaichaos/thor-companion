name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Put this build on a GitHub release (v<versionName>, a pre-release before 1.0)
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Test the decoder and build the app
        run: ./gradlew :decoder:test :app:assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: thor-companion-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ThorCompanion-addon
          path: addon/ThorCompanion
      - name: Name the release files after the version
        if: ${{ inputs.release }}
        run: |
          v=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          echo "VERSION=$v" >> "$GITHUB_ENV"
          mkdir out
          cp app/build/outputs/apk/debug/*.apk "out/ForeverCompanion-$v.apk"
          (cd addon && zip -qr "../out/ForeverCompanion-addon-$v.zip" ThorCompanion)
      - uses: softprops/action-gh-release@v2
        if: ${{ inputs.release }}
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: Forever Companion ${{ env.VERSION }}
          files: out/*
          prerelease: ${{ startsWith(env.VERSION, '0.') }}
          body_path: RELEASE_NOTES.md
