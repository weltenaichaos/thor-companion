name: Release

# A tag like v0.22.1 builds the app and puts it on a GitHub release together with
# the addon (as a zip to unpack into Interface/AddOns). Versions before 1.0 are
# marked as pre-releases.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Test the decoder and build the app
        run: ./gradlew :decoder:test :app:assembleDebug --console=plain
      - name: Name the files after the version
        run: |
          v="${GITHUB_REF_NAME#v}"
          mkdir out
          cp app/build/outputs/apk/debug/*.apk "out/ForeverCompanion-$v.apk"
          (cd addon && zip -qr "../out/ForeverCompanion-addon-$v.zip" ThorCompanion)
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
          generate_release_notes: false
          body_path: RELEASE_NOTES.md
